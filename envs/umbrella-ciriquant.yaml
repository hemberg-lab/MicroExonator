# CIRIquant 1.1.3 (MIT) quantifies a frozen circRNA catalogue: HISAT2 realignment
# against pseudo-circular sequences plus BSJ/FSJ counting on the shared umbrella
# HISAT2 BAM. src/run_ciriquant.py calls CIRIquant's own counting functions and
# replaces only the helpers that still carry Python 2 code (see that file).
# HISAT2 and samtools match the umbrella alignment environment. BWA, StringTie,
# scikit-learn and scipy come in as CIRIquant dependencies but are not used.
name: microexonator-umbrella-ciriquant
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - ciriquant=1.1.3
  - hisat2=2.2.1
  - samtools=1.20
  - pysam
  - pyyaml
