# Build environment for MAJIQ v3 (licensed; its source is supplied by the
# user as `majiq_source` and installed into this environment by
# src/install_majiq.py). Holds compilers, HTSlib and zstd so nothing comes
# from the system.
name: microexonator-umbrella-majiq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - setuptools>=45
  - git
  - c-compiler
  - cxx-compiler
  - htslib=1.20
  - zstd
  - numpy
