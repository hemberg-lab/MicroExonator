channels:
  - conda-forge
  - bioconda
  - defaults
  - cgat
dependencies:
  - numpy
  - pandas
  - hisat2=2.1.0
  - htslib=1.*
  - pysam
  - samtools=1.9
  - sra-tools=2.9.*
  - biopython
  # HISAT2 2.1.0 is only packaged through Python 3.7 on the supported channels.
  - python=3.7
  - pyBigWig
  - bwa=0.7.*
  - bowtie
